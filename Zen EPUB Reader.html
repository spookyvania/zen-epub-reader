<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen EPUB Reader</title>
<style>
  :root {
    --bg: #f3f0e8; --fg: #2a2926; --dim: #8b877d; --line: #d9d4c7;
    --fs: 16px; color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d0e0f; --fg: #b9b6ad; --dim: #5f5d57; --line: #232425;
    color-scheme: dark;
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  [hidden] { display: none !important; }
  button {
    font: inherit; color: inherit; background: none; border: 0; border-radius: 0;
    padding: 0 1ch; cursor: pointer; text-align: left;
  }
  button:hover, button:focus-visible { background: var(--fg); color: var(--bg); outline: none; }

  header {
    flex: none; display: flex; gap: 1ch; padding: 1px 0; color: var(--dim);
    border-bottom: 1px solid var(--line); position: relative; white-space: nowrap;
  }
  #ui-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #ui-progress { padding-right: 1ch; }
  #ui-bar { position: absolute; left: 0; bottom: -1px; height: 1px; width: 0; background: var(--fg); }

  #ui-menu {
    position: absolute; top: calc(1.5em + 3px); left: 0; z-index: 2;
    width: 36ch; max-width: 100vw; max-height: calc(100dvh - 1.5em - 3px); overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line); border-left: 0; border-top: 0; padding: 4px 0;
  }
  #ui-menu button, #ui-menu span { display: block; width: 100%; padding: 0 1ch; white-space: pre-wrap; }
  #ui-menu span, .dim { color: var(--dim); }

  #ui-home { flex: 1; min-height: 0; overflow-y: auto; }
  #ui-scroller { flex: 1; min-height: 0; overflow: hidden; padding: 2em 2ch; outline: none; }
  #ui-home { padding: 2em 1ch; }
  #ui-home > * { max-width: 68ch; margin: 0 auto; }
  #ui-library { list-style: none; padding: 0; }
  #ui-library li { display: flex; }
  #ui-library li > button:first-child { flex: 1; min-width: 0; }
  #ui-error { color: #c0564a; min-height: 1.5em; }
  #ui-content { height: 100%; max-width: 68ch; margin: 0 auto; font-size: var(--fs); }
  body.dragging::after {
    content: "drop to open"; position: fixed; inset: 0; z-index: 9;
    border: 1px dashed var(--fg); background: var(--bg); display: grid; place-items: center;
  }
</style>
</head>
<body>

<header>
  <button id="ui-menu-btn" title="menu (m)" aria-label="menu" aria-haspopup="true">≡</button>
  <span id="ui-title">Zen EPUB Reader</span>
  <span id="ui-progress"></span>
  <div id="ui-bar"></div>
</header>
<nav id="ui-menu" hidden aria-label="menu"></nav>

<section id="ui-home">
  <div><button id="ui-open">&gt; open file…</button></div>
  <div id="ui-error" role="alert"></div>
  <ul id="ui-library"></ul>
  <input type="file" id="ui-file" accept=".epub,application/epub+zip" multiple hidden>
</section>

<main id="ui-scroller" hidden tabindex="-1">
  <div id="ui-content"></div>
</main>

<script>
'use strict';
const $ = id => document.getElementById('ui-' + id);

/* ---------- settings ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('epub:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('epub:' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('epub:' + k); } catch {} },
};

let theme = store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function setTheme(t) { theme = t; store.set('theme', t); document.documentElement.dataset.theme = t; }
document.documentElement.dataset.theme = theme;

const FS_MIN = 10, FS_MAX = 40;
let fontSize = store.get('fontSize', 16);
function applyFontSize(keepPlace) {
  document.documentElement.style.setProperty('--fs', fontSize + 'px');
  if (keepPlace) relayout();
}
function changeFontSize(d) {
  fontSize = Math.min(FS_MAX, Math.max(FS_MIN, fontSize + d));
  store.set('fontSize', fontSize);
  applyFontSize(true);
}

/* ---------- zip ---------- */
function readZip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 22 - 65535); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  }
  if (e < 0) throw new Error('not a valid epub file');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const td = new TextDecoder(), files = new Map(), lower = new Map();
  for (let n = 0; n < count && dv.getUint32(p, true) === 0x02014b50; n++) {
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    files.set(name, { method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), size: dv.getUint32(p + 24, true), off: dv.getUint32(p + 42, true) });
    lower.set(name.toLowerCase(), name);
    p += 46 + nl + el + cl;
  }
  const find = name => files.get(name) || files.get(lower.get(name.toLowerCase()));
  return {
    has: name => !!find(name),
    size: name => find(name)?.size || 0,
    async bytes(name) {
      const f = find(name);
      if (!f) throw new Error('missing file in epub: ' + name);
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const raw = u8.subarray(start, start + f.csize);
      if (f.method === 0) return raw;
      if (f.method !== 8) throw new Error('unsupported compression in epub');
      const s = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(s).arrayBuffer());
    },
  };
}

/* ---------- epub parsing ---------- */
const dec = s => { try { return decodeURIComponent(s); } catch { return s; } };
function resolve(base, href) {
  const u = new URL(href, 'http://e/' + base.split('/').map(encodeURIComponent).join('/'));
  return { path: dec(u.pathname.slice(1)), frag: dec(u.hash.slice(1)) };
}
const parseXml = s => new DOMParser().parseFromString(s, 'application/xml');
function parseXhtml(s) {
  const d = new DOMParser().parseFromString(s, 'application/xhtml+xml');
  return d.getElementsByTagName('parsererror').length ? new DOMParser().parseFromString(s, 'text/html') : d;
}
const tags = (node, name) => [...node.getElementsByTagNameNS('*', name)];
const kids = (node, name) => [...node.children].filter(c => c.localName === name);
const clean = s => (s || '').replace(/\s+/g, ' ').trim();

async function parseBook(buf, fileName) {
  const zip = readZip(buf);
  const text = async n => new TextDecoder().decode(await zip.bytes(n));
  const rootfile = tags(parseXml(await text('META-INF/container.xml')), 'rootfile')[0];
  if (!rootfile) throw new Error('epub has no package file');
  const opfPath = rootfile.getAttribute('full-path');
  const opf = parseXml(await text(opfPath));
  const meta = n => clean(tags(opf, n)[0]?.textContent);

  const manifest = new Map(), types = new Map();
  let navPath = null;
  for (const it of tags(opf, 'item')) {
    const href = it.getAttribute('href'); if (!href) continue;
    const path = resolve(opfPath, href).path;
    manifest.set(it.getAttribute('id'), path);
    types.set(path, it.getAttribute('media-type') || '');
    if (/\bnav\b/.test(it.getAttribute('properties') || '')) navPath = path;
  }
  const spineEl = tags(opf, 'spine')[0];
  const spine = tags(opf, 'itemref').map(r => manifest.get(r.getAttribute('idref'))).filter(p => p && zip.has(p));
  if (!spine.length) throw new Error('epub has no readable sections');

  let toc = [];
  try {
    if (navPath && zip.has(navPath)) {
      const doc = parseXhtml(await text(navPath));
      const navs = tags(doc, 'nav');
      const nav = navs.find(n => /\btoc\b/.test(n.getAttribute('epub:type') || n.getAttribute('role') || '')) || navs[0];
      const walk = (list, depth) => {
        for (const li of kids(list, 'li')) {
          const a = kids(li, 'a')[0] || kids(li, 'span')[0];
          const href = a?.getAttribute('href');
          if (a && href) toc.push({ label: clean(a.textContent), depth, ...resolve(navPath, href) });
          for (const sub of kids(li, 'ol')) walk(sub, depth + 1);
        }
      };
      if (nav) for (const ol of kids(nav, 'ol')) walk(ol, 0);
    }
    const ncxPath = manifest.get(spineEl?.getAttribute('toc'));
    if (!toc.length && ncxPath && zip.has(ncxPath)) {
      const map = tags(parseXml(await text(ncxPath)), 'navMap')[0];
      const walk = (node, depth) => {
        for (const np of kids(node, 'navPoint')) {
          const src = kids(np, 'content')[0]?.getAttribute('src');
          const label = clean(kids(np, 'navLabel')[0]?.textContent);
          if (src) toc.push({ label, depth, ...resolve(ncxPath, src) });
          walk(np, depth + 1);
        }
      };
      if (map) walk(map, 0);
    }
  } catch (err) { console.warn('could not read table of contents', err); }
  toc = toc.filter(t => spine.includes(t.path));
  if (!toc.length) toc = spine.map((path, i) => ({ label: 'section ' + (i + 1), depth: 0, path, frag: '' }));
  for (const t of toc) { t.index = spine.indexOf(t.path); if (!t.label) t.label = 'untitled'; }

  const title = meta('title') || fileName.replace(/\.epub$/i, '');
  const urls = new Map();
  // Section weights (by file size) so overall progress reflects length, not section count.
  const sizes = spine.map(p => zip.size(p) || 1), before = [];
  let total = 0;
  for (const s of sizes) { before.push(total); total += s; }
  return {
    sizes, before, total,
    id: meta('identifier') || title + ':' + buf.byteLength,
    title, author: meta('creator'), spine, toc, text,
    async url(path) {
      if (!zip.has(path)) return '';
      if (!urls.has(path)) urls.set(path, URL.createObjectURL(new Blob([await zip.bytes(path)], { type: types.get(path) || '' })));
      return urls.get(path);
    },
    close() { for (const u of urls.values()) URL.revokeObjectURL(u); urls.clear(); },
  };
}

/* ---------- library (IndexedDB) ---------- */
const db = {
  open() {
    return this.p ||= new Promise((res, rej) => {
      const r = indexedDB.open('epub-reader', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('meta', { keyPath: 'id' }); r.result.createObjectStore('data', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(['meta', 'data'], mode);
      const rq = fn(t.objectStore('meta'), t.objectStore('data'));
      t.oncomplete = () => res(rq?.result); t.onerror = t.onabort = () => rej(t.error);
    });
  },
};

async function renderLibrary() {
  let books = [];
  try { books = await db.run('readonly', m => m.getAll()); } catch { /* storage unavailable */ }
  books.sort((a, b) => b.opened - a.opened);
  $('library').replaceChildren(...books.map(b => {
    const li = document.createElement('li');
    const open = document.createElement('button');
    const pos = store.get('pos:' + b.id);
    const info = [b.author, pos && Math.round(pos.p * 100) + '%'].filter(Boolean).join(' · ');
    open.append('  ' + b.title + ' ', Object.assign(document.createElement('span'), { className: 'dim', textContent: info }));
    open.onclick = async () => {
      try { const rec = await db.run('readonly', (m, d) => d.get(b.id)); await openBuffer(rec.buf, b.title); }
      catch (err) { showError(err); }
    };
    const rm = Object.assign(document.createElement('button'), { textContent: 'x', title: 'remove from library', className: 'dim' });
    rm.setAttribute('aria-label', 'remove ' + b.title + ' from library');
    rm.onclick = async () => {
      if (!confirm('Remove "' + b.title + '" from the library? The original file is not affected.')) return;
      await db.run('readwrite', (m, d) => { m.delete(b.id); d.delete(b.id); });
      store.del('pos:' + b.id);
      renderLibrary();
    };
    li.append(open, rm);
    return li;
  }));
}

/* ---------- reader ---------- */
let book = null, cur = 0, activeToc = -1;
const scroller = $('scroller');
const shadow = $('content').attachShadow({ mode: 'open' });
shadow.innerHTML = `<style>
  :host { display: block; }
  article { height: 100%; overflow: hidden; column-fill: auto; column-gap: 48px; line-height: 1.6; overflow-wrap: break-word; orphans: 2; widows: 2; }
  article > :first-child { margin-top: 0; }
  ::selection { background: var(--fg); color: var(--bg); }
  p { margin: 0 0 1.6em; }
  h1, h2, h3, h4, h5, h6 { font-size: 1em; font-weight: bold; margin: 3.2em 0 1.6em; break-after: avoid; }
  h1, h2 { text-transform: uppercase; letter-spacing: .08em; }
  h1:first-child, h2:first-child { margin-top: 0; }
  img, svg { max-width: 100%; max-height: var(--ph, 100%); height: auto; object-fit: contain; break-inside: avoid; }
  a { color: inherit; text-underline-offset: 3px; }
  blockquote { margin: 0 0 1.6em; padding-left: 2ch; border-left: 1px solid var(--dim); color: var(--dim); }
  pre { white-space: pre-wrap; }
  code, pre, small, sub, sup { font: inherit; }
  table { border-collapse: collapse; max-width: 100%; }
  td, th { border: 1px solid var(--line); padding: 0 1ch; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 3.2em 0; }
</style><article></article>`;
const article = shadow.querySelector('article');

/* Pagination: the section is laid out in CSS columns, each exactly one window-sized page wide. */
const GAP = 48;
let page = 0, pages = 1, pageW = 0;
function layout() {
  pageW = $('content').clientWidth;
  article.style.width = article.style.columnWidth = pageW + 'px';
  article.style.setProperty('--ph', article.clientHeight + 'px');
  pages = Math.max(1, Math.round((article.scrollWidth + GAP) / (pageW + GAP)));
}
function goPage(n) {
  page = Math.min(pages - 1, Math.max(0, n));
  article.scrollLeft = page * (pageW + GAP);
  updateProgress();
}
function relayout() {
  if (!book) return;
  const f = page / pages;
  layout();
  goPage(Math.round(f * pages));
}
function turn(d) {
  if (!book) return;
  const n = page + d;
  if (n >= pages) { if (cur < book.spine.length - 1) showChapter(cur + 1); }
  else if (n < 0) { if (cur > 0) showChapter(cur - 1, { last: true }); }
  else goPage(n);
}
const pageOf = el => Math.floor((el.getBoundingClientRect().left - article.getBoundingClientRect().left + article.scrollLeft) / (pageW + GAP));
addEventListener('resize', relayout);
article.addEventListener('load', relayout, true); // images change the page count once loaded

function showError(err) { console.error(err); $('error').textContent = '! ' + (err?.message || String(err)).toLowerCase(); }

function setView(reading) {
  $('scroller').hidden = !reading;
  $('home').hidden = reading;
  closeMenu();
  if (!reading) {
    $('title').textContent = document.title = 'Zen EPUB Reader';
    $('progress').textContent = ''; $('bar').style.width = 0;
    renderLibrary();
  }
}
function goHome() { book?.close(); book = null; article.replaceChildren(); setView(false); }

async function openBuffer(buf, fileName, save) {
  const b = await parseBook(buf, fileName);
  book?.close();
  book = b;
  $('error').textContent = '';
  $('title').textContent = book.author ? book.title + ' · ' + book.author : book.title;
  document.title = book.title;
  setView(true);
  const pos = store.get('pos:' + book.id, { i: 0, f: 0 });
  await showChapter(pos.i, { frac: pos.f });
  try {
    const now = Date.now();
    await db.run('readwrite', (m, d) => {
      m.put({ id: book.id, title: book.title, author: book.author, opened: now });
      if (save) d.put({ id: book.id, buf });
    });
  } catch (err) { console.warn('could not save to library', err); }
}

async function showChapter(i, opt = {}) {
  if (!book) return;
  cur = i = Math.min(book.spine.length - 1, Math.max(0, i | 0));
  const path = book.spine[i];
  const doc = parseXhtml(await book.text(path));
  const body = doc.querySelector('body') || doc.documentElement;

  body.querySelectorAll('script,style,link,iframe,object,embed,form,meta,base,audio,video').forEach(n => n.remove());
  for (const el of body.querySelectorAll('*')) {
    for (const a of [...el.attributes]) if (/^on/i.test(a.name) || a.name === 'style') el.removeAttribute(a.name);
  }
  for (const img of body.querySelectorAll('img')) {
    const src = img.getAttribute('src');
    img.removeAttribute('srcset');
    img.setAttribute('src', src ? await book.url(resolve(path, src).path) : '');
  }
  for (const im of tags(body, 'image')) {
    const href = im.getAttribute('href') || im.getAttribute('xlink:href');
    im.removeAttribute('xlink:href');
    im.setAttribute('href', href ? await book.url(resolve(path, href).path) : '');
  }
  for (const a of body.querySelectorAll('a[href]')) {
    const h = a.getAttribute('href');
    if (/^(https?|mailto):/i.test(h)) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); }
    else if (/^[a-z][a-z0-9+.-]*:/i.test(h)) a.removeAttribute('href');
    else { const r = resolve(path, h); a.setAttribute('data-path', r.path); a.setAttribute('data-frag', r.frag); a.setAttribute('href', '#'); }
  }
  if (i !== cur) return; // a newer navigation happened while loading

  const frag = document.createDocumentFragment();
  for (const n of [...body.childNodes]) frag.append(document.importNode(n, true));
  article.replaceChildren(frag);

  article.scrollLeft = 0;
  layout();
  const target = opt.frag && shadow.getElementById(opt.frag);
  activeToc = -1;
  book.toc.forEach((t, n) => { if (t.index <= i) activeToc = n; });
  goPage(target ? pageOf(target) : opt.last ? pages - 1 : Math.round((opt.frac || 0) * pages));
  scroller.focus({ preventScroll: true });
}

function updateProgress() {
  if (!book) return;
  const p = (book.before[cur] + (page + 1) / pages * book.sizes[cur]) / book.total;
  $('progress').textContent = `${page + 1}/${pages} ${Math.round(p * 100)}%`;
  $('bar').style.width = p * 100 + '%';
  store.set('pos:' + book.id, { i: cur, f: page / pages, p });
}

// Turn pages with the wheel, or by clicking: left third goes back, the rest goes forward.
let wheelAt = 0;
scroller.addEventListener('wheel', e => {
  e.preventDefault();
  if (Math.abs(e.deltaY) < 4 || Date.now() - wheelAt < 200) return;
  wheelAt = Date.now();
  turn(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
scroller.addEventListener('click', e => {
  if (e.composedPath().some(n => n.localName === 'a') || String(getSelection())) return;
  turn(e.clientX < innerWidth / 3 ? -1 : 1);
});

shadow.addEventListener('click', e => {
  const a = e.target.closest?.('a[data-path]');
  if (!a) return;
  e.preventDefault();
  const idx = book.spine.indexOf(a.getAttribute('data-path'));
  if (idx < 0) return;
  showChapter(idx, { frag: a.getAttribute('data-frag') });
});

/* ---------- menu ---------- */
// Each menu returns rows of [label, action, stayOpen]; a row with no action is a plain label.
const menus = {
  root: () => [
    book && ['contents ›', () => openMenu('contents'), true],
    ['text size ›', () => openMenu('size'), true],
    ['theme ›', () => openMenu('theme'), true],
    book && ['library', goHome],
    ['open file…', () => $('file').click()],
  ],
  contents: () => book.toc.map((t, n) =>
    [(n === activeToc ? '* ' : '  ') + '  '.repeat(t.depth) + t.label, () => showChapter(t.index, { frag: t.frag })]),
  size: () => [
    ['  ' + fontSize + 'px'],
    ['- smaller', () => changeFontSize(-1), true],
    ['+ larger', () => changeFontSize(1), true],
  ],
  theme: () => ['light', 'dark'].map(t => [(t === theme ? '* ' : '  ') + t, () => setTheme(t), true]),
};
let menuName = null;
function openMenu(name, focusIndex) {
  menuName = name;
  const rows = menus[name]().filter(Boolean);
  if (name !== 'root') rows.unshift(['‹ back', () => openMenu('root'), true]);
  const menu = $('menu');
  menu.replaceChildren(...rows.map(([label, action, stay], n) => {
    if (!action) return Object.assign(document.createElement('span'), { textContent: label });
    const b = Object.assign(document.createElement('button'), { textContent: label });
    b.onclick = () => {
      if (!stay) closeMenu();
      action();
      if (stay && menuName === name) openMenu(name, n); // refresh in place
    };
    return b;
  }));
  menu.hidden = false;
  const btns = menu.querySelectorAll('button');
  const want = focusIndex != null ? menu.children[focusIndex] : btns[name === 'root' ? 0 : 1];
  (want?.tagName === 'BUTTON' ? want : btns[0])?.focus();
  if (name === 'contents' && focusIndex == null) [...btns].find(b => b.textContent.startsWith('*'))?.focus();
}
function closeMenu() { menuName = null; $('menu').hidden = true; if (book) scroller.focus({ preventScroll: true }); }
$('menu-btn').onclick = () => menuName ? closeMenu() : openMenu('root');
addEventListener('pointerdown', e => {
  if (menuName && !$('menu').contains(e.target) && e.target !== $('menu-btn')) closeMenu();
});

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (menuName) {
    const btns = [...$('menu').querySelectorAll('button')], at = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') btns[(at + 1) % btns.length]?.focus();
    else if (e.key === 'ArrowUp') btns[(at - 1 + btns.length) % btns.length]?.focus();
    else if (e.key === 'ArrowRight') document.activeElement.click?.();
    else if (e.key === 'Escape' || e.key === 'ArrowLeft') menuName === 'root' ? closeMenu() : openMenu('root');
    else if (e.key === 'm') closeMenu();
    else return;
    e.preventDefault();
    return;
  }
  if (e.key === 'm') openMenu('root');
  else if (e.key === '+' || e.key === '=') changeFontSize(1);
  else if (e.key === '-') changeFontSize(-1);
  else if (!book) return;
  else if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) turn(1);
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key) || e.key === ' ') turn(-1);
  else return;
  e.preventDefault();
});

/* ---------- opening files ---------- */
async function openFiles(files) {
  const list = [...files].filter(f => /\.epub$/i.test(f.name) || f.type === 'application/epub+zip');
  if (!list.length) return showError(new Error('choose an .epub file'));
  try {
    for (const f of list) await openBuffer(await f.arrayBuffer(), f.name, true);
  } catch (err) { showError(err); if (!book) setView(false); }
}
$('open').onclick = () => $('file').click();
$('file').onchange = e => { openFiles(e.target.files); e.target.value = ''; };

let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  openFiles(e.dataTransfer.files);
});

applyFontSize(false);
setView(false);
</script>
</body>
</html>
